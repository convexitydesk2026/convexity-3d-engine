[Study]
name = ORB20-ADAPT_Champion_Swing_V18
n_trials = 500
n_jobs = 10

[Fixed_Parameters]
start_date = 2016-12-01
end_date = 2022-12-31
initial_aum = 1000000.0
min_open_price = 4.0
use_regime_filter = Yes
regime_sma = 200

[Hyperparameter_Space]
# V18 ORB Window: Scans the first X minutes to define Morning Resistance
orb_window = categorical(15, 30, 45, 60)

# TC2000 Momentum Threshold
atr_target = 4.0, 12.0, 0.5

# R-Multiple to trigger breakeven/trailing stop
transition_r = categorical(1.0, 1.5, 2.0, 3.0)

# Pure ATR Stop Multiplier (Distance from Confirmed Breakout Close)
atr_stop_multiplier = categorical(0.75, 1.0, 1.5, 2.0)

trailing_sma = categorical(sma_10_prev, sma_20_prev, sma_50_prev)
max_positions = categorical(10, 15, 20)
risk_pct = categorical(0.001, 0.002, 0.003)