# Goal: Optuna study configuration for the 7.5x ATR Vectorized Swing Engine

[Study]
name = ORB20-ADAPT_Champion_Swing_v2
n_trials = 500
n_jobs = 10

[Fixed_Parameters]
start_date = 2016-12-01
end_date = 2025-11-26
initial_aum = 1000000.0
risk_pct = 0.001
max_positions = 15

[Hyperparameter_Space]
# Entry time in minutes from market open (09:30). 15=09:45, 30=10:00, 45=10:15
entry_time = categorical(15, 30, 45)

# The core momentum breakout threshold
atr_target = 5.0, 10.0, 0.5

# R-Multiple at which the Trailing SMA replaces the LOD Initial Stop
transition_r = categorical(1.0, 1.5, 2.0)

# Which Daily SMA to use as the trailing stop
trailing_sma = categorical(sma_10_prev, sma_20_prev, sma_50_prev)